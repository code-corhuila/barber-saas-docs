openapi: 3.0.3
info:
  title: "barber-saas-[domain]-api"
  version: 1.0.0
  description: |
    API of the [service-name] service.

    ## Authentication
    Every endpoint requires a valid JWT in the header:
    ```
    Authorization: Bearer <token>
    ```

    ## Error handling
    Every error follows the `ErrorResponse` schema defined in `_shared.yaml`.

    ## Pagination
    List endpoints support pagination via `?page=1&limit=20`.

servers:
  - url: http://localhost:8000
    description: Local api-gateway (single entry, norm 5.6.1) — paths include `/api/v1`
  - url: https://api.dev.{domain}
    description: Development api-gateway
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production api-gateway
    variables:
      domain:
        default: example.com

# Default security for every endpoint
security:
  - bearerAuth: []

tags:
  - name: [Resource A]
    description: Operations on [Resource A]
  - name: Health
    description: Service health check

paths:
  /health:
    get:
      summary: Health check
      description: Checks that the service is running and its dependencies are available.
      tags:
        - Health
      security: []  # Internal probe for barber-saas-infra; not published through the gateway
      servers:
        - url: http://[domain]-api:8080
          description: Internal compose network
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time
                  dependencies:
                    type: object
                    description: Dependency status
                    properties:
                      database:
                        type: string
                        enum: [ok, degraded, down]
              example:
                status: ok
                timestamp: '2026-01-15T10:30:00Z'
                dependencies:
                  database: ok
        '503':
          $ref: './_shared.yaml#/components/responses/ServiceUnavailable'

  /api/v1/[resources]:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/CorrelationIdHeader'
    get:
      summary: List [resources]
      description: Returns a paginated list of [resources].
      operationId: list[Resources]
      tags:
        - [Resource A]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - name: [filter]
          in: query
          description: Filter by [criterion]
          schema:
            type: string
      responses:
        '200':
          description: List of [resources]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/[Resource]Response'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

    post:
      summary: Create [resource]
      description: Creates a new [resource] with the given data.
      operationId: create[Resource]
      tags:
        - [Resource A]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create[Resource]Request'
            example:
              [field1]: "example value"
              [field2]: "example value"
      responses:
        '201':
          description: "[Resource] created"
          headers:
            Location:
              $ref: './_shared.yaml#/components/headers/Location'
            X-Correlation-Id:
              $ref: './_shared.yaml#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[Resource]Response'
        '200':
          description: Retry with the same Idempotency-Key; returns the resource already created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[Resource]Response'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

  /api/v1/[resources]/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IdParam'
      - $ref: './_shared.yaml#/components/parameters/CorrelationIdHeader'

    get:
      summary: Get [resource] by id
      operationId: get[Resource]ById
      tags:
        - [Resource A]
      responses:
        '200':
          description: "[Resource] found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[Resource]Response'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

    patch:
      summary: Update [resource]
      description: Partial update (only the fields sent are modified).
      operationId: update[Resource]
      tags:
        - [Resource A]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update[Resource]Request'
      responses:
        '200':
          description: "[Resource] updated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[Resource]Response'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

    delete:
      summary: Delete [resource]
      description: Deactivation (`is_active = false`) or a terminal status, per the deletion model in `06-data/data-dictionary.md`.
      operationId: delete[Resource]
      tags:
        - [Resource A]
      responses:
        '204':
          description: Deleted (no response body)
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

components:
  schemas:
    # ─── Request schemas ────────────────────────────────────────────────
    Create[Resource]Request:
      type: object
      description: Data to create a new [resource]
      required:
        - [requiredField1]
        - [requiredField2]
      properties:
        [requiredField1]:
          type: string
          minLength: 1
          maxLength: 255
          description: "[Field description]"
          example: "[example value]"
        [requiredField2]:
          type: string
          description: "[Description]"
          example: "[example]"
        [optionalField]:
          type: string
          nullable: true
          description: "[Description]"
          example: null

    Update[Resource]Request:
      type: object
      description: Updatable fields of [resource] (all optional)
      properties:
        [field1]:
          type: string
          minLength: 1
          maxLength: 255
          description: "[Description]"
        [field2]:
          type: string
          description: "[Description]"

    # ─── Response schemas ───────────────────────────────────────────────
    [Resource]Response:
      description: Full representation of a [resource]
      # allOf composes this schema with the shared audit fields.
      # AuditFields defines createdAt, updatedAt and createdBy — do not repeat them here.
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required:
            - id
            - [requiredField1]
            - status
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            [requiredField1]:
              type: string
              example: "[value]"
            status:
              type: string
              enum: [ACTIVE, INACTIVE, CANCELLED]
              example: ACTIVE

  # ─── Security ─────────────────────────────────────────────────────────
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
